name: Deploy portal to VPS
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
concurrency:
  group: deploy-portal
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH to the VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ship code to the VPS
        run: |
          tar --exclude=node_modules --exclude=dist --exclude=.git -czf /tmp/app.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/app.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/portal.tar.gz"
      - name: Rebuild and restart on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cp /opt/portal/app/web/.env /root/portal-web.env.keep
            rm -rf /opt/portal/app && mkdir -p /opt/portal/app && tar xzf /root/portal.tar.gz -C /opt/portal/app
            cp /root/portal-web.env.keep /opt/portal/app/web/.env
            cp /opt/portal/app/supabase/functions/sync-content/index.ts /opt/portal/volumes/functions/sync-content/index.ts
            cd /opt/portal && docker compose build portal-web && docker compose up -d portal-web && docker compose restart portal-functions && docker compose ps'
