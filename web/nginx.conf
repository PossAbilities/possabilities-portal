server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA: every route serves index.html. No caching on HTML so deploys show immediately (Cloudflare respects no-store).
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /sw.js { add_header Cache-Control "no-store"; }
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
}
